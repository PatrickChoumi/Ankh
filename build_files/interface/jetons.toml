# Valeurs de référence de l'interface d'Ankh (D-052) : celles de Windows 11,
# que le banc de mesure compare à ce qu'Ankh affiche dans la VM de test
# (tests/vm/banc, rapport « ui-rapport.md » joint aux captures).
#
# Sources, toutes à l'échelle 100 % (pixels effectifs de Windows) :
#   WinUI : https://github.com/microsoft/microsoft-ui-xaml, commit 566a040
#           (2026-10-14), dossier controls/dev ; licence MIT ;
#   Doc   : https://learn.microsoft.com/windows/apps/design/ ;
#   Terminal : https://github.com/microsoft/terminal.
# Les couleurs ne sont pas celles de Windows : Ankh garde les siennes
# (D-037, D-042). Elles sont relevées ici, et rangées par couches au lot 1.
#
# Chaque [[mesure]] :
#   id         nom de la mesure produite par le banc (tests/vm/banc/banc.sh)
#   libelle    ce qui est mesuré
#   cible      la valeur retenue pour Ankh ; absente pour un simple relevé
#   tolerance  écart admis pour un nombre (même unité)
#   unite      px, ms, pt…
#   lot        le lot de D-052 qui atteint la cible
#   source     d'où vient la cible
#
# Une mesure devient obligatoire quand son lot figure dans lots_termines :
# un écart fait alors échouer le test en VM. Chaque PR de lot ajoute son
# numéro ici, avec les mesures qu'elle atteint.
lots_termines = []

