<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Ankh (D-052, lot 1) : polices lissées en niveaux de gris, contours
  légèrement ajustés (hintslight), comme les applications de Windows 11.
  « assign_replace » remplace les valeurs posées avant ; sans cela, Qt
  prendrait la disposition des sous-pixels annoncée par l'écran. Un réglage
  fait dans le module des polices de KDE (~/.config/fontconfig/fonts.conf,
  lu plus tard par 50-user.conf) passe après celui-ci, et le remplace.
-->
<fontconfig>
  <description>Ankh : rendu des polices en niveaux de gris, contours légers</description>
  <match target="pattern">
    <edit name="antialias" mode="assign_replace"><bool>true</bool></edit>
    <edit name="hinting" mode="assign_replace"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign_replace"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign_replace"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign_replace"><const>lcdnone</const></edit>
  </match>
</fontconfig>
