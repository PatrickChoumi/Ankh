# D-052, lot 8d : les applications Flatpak en GTK 3 lisent le thème Fluent-Ankh
# de l'image, en lecture seule (mon choix du 2026-10-24).
#
# Flatpak monte dans chaque application les « extensions non maintenues »
# posées dans son installation du système : /var/lib/flatpak/extension/<nom>/
# <architecture>/<branche>, un dossier ou un lien vers lui
# (flatpak_dir_get_unmaintained_extension_dir_if_exists, common/flatpak-dir.c
# de Flatpak 1.18.4). Les runtimes de Flathub (freedesktop 25.08 et 26.08,
# GNOME 49, KDE 6.10) déclarent les thèmes GTK 3 comme extension
# org.gtk.Gtk3theme, branche 3.22, montée en lecture seule dans
# share/runtime/share/themes/<nom>/gtk-3.0 (flatpak remote-info --show-metadata).
#
# Le seul dossier gtk-3.0 du thème entre dans les applications : aucune
# permission de Flatpak ne change. /var n'est pas écrit par l'image (bootc) :
# le lien est recréé à chaque démarrage, vers le thème de la version de l'image
# démarrée.
d /var/lib/flatpak/extension 0755 root root -
d /var/lib/flatpak/extension/org.gtk.Gtk3theme.Fluent-Ankh 0755 root root -
d /var/lib/flatpak/extension/org.gtk.Gtk3theme.Fluent-Ankh/x86_64 0755 root root -
L+ /var/lib/flatpak/extension/org.gtk.Gtk3theme.Fluent-Ankh/x86_64/3.22 - - - - /usr/share/themes/Fluent-Ankh/gtk-3.0
