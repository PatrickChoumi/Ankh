# Conteneur de dev d'Ankh (D-012, D-032), créé par « distrobox assemble » au
# premier lancement de VS Code depuis le menu (D-036).
# https://github.com/89luca89/distrobox/blob/main/docs/usage/distrobox-assemble.md
# VS Code n'est pas exporté par distrobox : le menu d'Ankh a déjà son entrée
# (ankh-vscode.desktop), qui sert aussi avant la création.
# entry=false (--no-entry de distrobox-create) : distrobox n'ajoute pas au menu
# l'entrée « Ankh-dev », au logo de Fedora, qui ouvrait un terminal dans le
# conteneur (D-034, D-036 : pas de « ankh-dev » à gérer).
[ankh-dev]
image=ghcr.io/patrickchoumi/ankh-dev:latest
pull=true
entry=false
