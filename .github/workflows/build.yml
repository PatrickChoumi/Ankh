---
# Construit, teste, publie et signe les images Ankh (D-018, D-021, D-022).
# Sur une PR : construction et tests seulement, rien n'est publié.
# Sur main : construction, tests, publication sur GHCR, signature sans clé.
name: Construire les images Ankh

on:
  pull_request:
    branches:
      - main
  # Pas de filtre sur les PR : les tests obligatoires doivent toujours répondre.
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'  # un changement de documentation ne republie pas les images
  # Chaque lundi : reconstruction pour suivre les correctifs de Chrome (D-023).
  # Les images publiées sont seulement proposées : la machine ne se met à jour
  # que quand je le décide, depuis Discover (D-031).
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Construire ${{ matrix.variant }}
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write  # identité OIDC pour la signature sans clé (D-022)

    strategy:
      fail-fast: false
      matrix:
        variant:
          - ankh
          - ankh-nvidia

    env:
      VARIANT: ${{ matrix.variant }}
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

    steps:
      # Versions des actions épinglées par commit, tenues à jour par Renovate.
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Libérer de l'espace disque
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Installer just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Vérifier le format du Justfile
        run: just --unstable --fmt --check

      - name: Construire l'image
        run: just build "${VARIANT}"

      - name: Tester l'image
        run: just test "${VARIANT}"

      - name: Préparer le nom de publication
        if: env.PUBLISH == 'true'
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "DEST=ghcr.io/${owner}/${VARIANT}" >> "${GITHUB_ENV}"

      - name: Se connecter à GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7  # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier sur GHCR
        if: env.PUBLISH == 'true'
        id: push
        run: |
          set -euo pipefail
          date_tag="$(date -u +%Y%m%d)"
          for tag in latest "${date_tag}"; do
            podman push --digestfile=/tmp/digest \
              "localhost/${VARIANT}:latest" "${DEST}:${tag}"
          done
          echo "digest=$(< /tmp/digest)" >> "${GITHUB_OUTPUT}"

      - name: Installer cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v3.1.2'

      # Ancien format de signature, comme le modèle Universal Blue, pour rester
      # lisible par podman et rpm-ostree :
      # https://github.com/containers/container-libs/issues/388
      - name: Signer sans clé (D-022)
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes --new-bundle-format=false --use-signing-config=false \
            "${DEST}@${DIGEST}"

      - name: Vérifier la signature
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          cosign verify --new-bundle-format=false \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${DEST}@${DIGEST}" > /dev/null
          echo "Signature vérifiée pour ${DEST}@${DIGEST}"
